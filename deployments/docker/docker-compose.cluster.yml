# 3-Node Surgewave Cluster with Raft Consensus
#
# Usage:
#   docker compose -f docker-compose.cluster.yml up -d --wait
#
# The broker image is the released one. To run a working tree instead, build it into the local
# Docker daemon and name it:
#   dotnet publish src/Kuestenlogik.Surgewave.Broker.App -c Release -t:PublishContainer \
#     -p:ContainerRepository=surgewave-broker -p:ContainerImageTags=dev
#   SURGEWAVE_BROKER_IMAGE=surgewave-broker:dev docker compose -f docker-compose.cluster.yml up -d --wait
#
# This creates a 3-node cluster with:
#   - Raft consensus for controller election and metadata replication
#   - Automatic leader election and failover
#   - Client ports on the Docker host: 9092 (surgewave-1), 9093 (surgewave-2), 9094 (surgewave-3)
#   - REST, /health and /metrics on the Docker host: 9095, 9096, 9097
#   - gRPC on the Docker host: 9098, 9099, 9100
#
# A broker is ready, and healthy here, only once it has caught up with the metadata log, which
# takes a leader and therefore two of the three brokers. The brokers start together and none of
# them waits for another one's health: a broker that waited for a healthy broker 1 would wait
# for a broker that cannot become healthy alone. A single broker can be stopped and started at
# any time; the other two keep the quorum.
#
# Every broker tells clients its service name (surgewave-1:9092, ...), which resolves inside
# this network. A client on the Docker host reaches the published ports, is then sent to those
# names and needs them resolvable (hosts file) — or runs inside the network
# (<project>_surgewave-cluster), as scripts/ci/compose-cluster-smoke.sh does with the CLI image.

x-surgewave-broker: &surgewave-broker
  image: ${SURGEWAVE_BROKER_IMAGE:-ghcr.io/kuestenlogik/surgewave-broker:0.6.0}
  restart: unless-stopped
  networks:
    - surgewave-cluster
  healthcheck:
    # The image holds no curl; the broker executable asks its own /health/ready, on the
    # endpoint it is configured with.
    test: ["CMD", "dotnet", "/app/surgewave-broker.dll", "health", "ready"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

x-surgewave-broker-environment: &surgewave-broker-environment
  DOTNET_RUNNING_IN_CONTAINER: "true"
  # Bind every interface; Host is the name clients and the other brokers are told.
  Surgewave__BindAddress: 0.0.0.0
  Surgewave__Port: 9092
  Surgewave__GrpcPort: 9095
  Surgewave__ReplicationPort: 10092
  # The broker's two HTTP endpoints, in cleartext as the image serves them: REST, /health and
  # /metrics over HTTP/1.1 on the gRPC port set above, gRPC over HTTP/2 on the second one. The
  # image's own endpoints name ports 9093 and 9094, which are the client ports of brokers 2
  # and 3 on the Docker host. With Surgewave__GrpcUseTls=true and a certificate both endpoints
  # serve gRPC and REST over HTTPS, on the same ports.
  Kestrel__Endpoints__Grpc__Url: http://*:9095
  Kestrel__Endpoints__GrpcHttp3__Url: http://*:9098
  Surgewave__DataDirectory: /app/data
  Surgewave__RaftDataDirectory: /app/data/raft
  # Who exists (id:host:port:replicationPort) and who votes on metadata (id@host:replicationPort).
  # Identical on every broker.
  Surgewave__ClusterNodes: 1:surgewave-1:9092:10092,2:surgewave-2:9092:10092,3:surgewave-3:9092:10092
  Surgewave__ControllerQuorumVoters: 1@surgewave-1:10092,2@surgewave-2:10092,3@surgewave-3:10092
  Surgewave__AutoCreateTopics: "true"
  Surgewave__DefaultNumPartitions: 3
  Surgewave__DefaultReplicationFactor: 3
  Surgewave__MinInSyncReplicas: 2

services:
  surgewave-1:
    <<: *surgewave-broker
    container_name: surgewave-1
    hostname: surgewave-1
    ports:
      - "9092:9092"      # Client protocol
      - "9095:9095"      # REST, health, metrics
      - "9098:9098"      # gRPC
      - "10092:10092"    # Replication port
    volumes:
      - surgewave-1-data:/app/data
      - surgewave-1-logs:/app/logs
      - surgewave-1-raft:/app/data/raft
    environment:
      <<: *surgewave-broker-environment
      Surgewave__BrokerId: 1
      Surgewave__Host: surgewave-1

  surgewave-2:
    <<: *surgewave-broker
    container_name: surgewave-2
    hostname: surgewave-2
    ports:
      - "9093:9092"      # Client protocol (external 9093)
      - "9096:9095"      # REST, health, metrics
      - "9099:9098"      # gRPC
      - "10093:10092"    # Replication port
    volumes:
      - surgewave-2-data:/app/data
      - surgewave-2-logs:/app/logs
      - surgewave-2-raft:/app/data/raft
    environment:
      <<: *surgewave-broker-environment
      Surgewave__BrokerId: 2
      Surgewave__Host: surgewave-2
    depends_on:
      surgewave-1:
        condition: service_started

  surgewave-3:
    <<: *surgewave-broker
    container_name: surgewave-3
    hostname: surgewave-3
    ports:
      - "9094:9092"      # Client protocol (external 9094)
      - "9097:9095"      # REST, health, metrics
      - "9100:9098"      # gRPC
      - "10094:10092"    # Replication port
    volumes:
      - surgewave-3-data:/app/data
      - surgewave-3-logs:/app/logs
      - surgewave-3-raft:/app/data/raft
    environment:
      <<: *surgewave-broker-environment
      Surgewave__BrokerId: 3
      Surgewave__Host: surgewave-3
    depends_on:
      surgewave-1:
        condition: service_started

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: surgewave-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus-cluster.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - surgewave-cluster
    depends_on:
      - surgewave-1
      - surgewave-2
      - surgewave-3
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: surgewave-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - surgewave-cluster
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  surgewave-1-data:
    driver: local
  surgewave-1-logs:
    driver: local
  surgewave-1-raft:
    driver: local
  surgewave-2-data:
    driver: local
  surgewave-2-logs:
    driver: local
  surgewave-2-raft:
    driver: local
  surgewave-3-data:
    driver: local
  surgewave-3-logs:
    driver: local
  surgewave-3-raft:
    driver: local
  grafana-data:
    driver: local

networks:
  surgewave-cluster:
    driver: bridge
