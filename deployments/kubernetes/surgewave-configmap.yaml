apiVersion: v1
kind: ConfigMap
metadata:
  name: surgewave-config
  labels:
    app: surgewave
    app.kubernetes.io/name: surgewave
data:
  # Replaces the image's appsettings.json. What differs per pod or depends on the namespace —
  # BrokerId, Host, ClusterNodes, ControllerQuorumVoters — is set on the StatefulSet.
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "Kestrel": {
        "Endpoints": {
          "Grpc": {
            "Url": "http://*:9093",
            "Protocols": "Http1AndHttp2"
          }
        }
      },
      "Surgewave": {
        "BindAddress": "0.0.0.0",
        "Port": 9092,
        "GrpcPort": 9093,
        "DataDirectory": "/data",
        "LogDirectory": "/data/logs",
        "AutoCreateTopics": true,
        "DefaultReplicationFactor": 3,
        "DefaultNumPartitions": 3,
        "RaftDataDirectory": "/data/raft",
        "LogRetentionHours": 168,
        "TieredStorage": {
          "Enabled": false
        },
        "SchemaRegistry": {
          "Enabled": true
        },
        "Connect": {
          "Enabled": false
        },
        "Security": {
          "SaslEnabled": false,
          "AclEnabled": false
        }
      }
    }
