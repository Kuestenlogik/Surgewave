# Headless service for StatefulSet DNS: every broker is
# <pod>.surgewave-headless.<namespace>.svc, the name it tells clients and the other brokers.
apiVersion: v1
kind: Service
metadata:
  name: surgewave-headless
  labels:
    app: surgewave
    app.kubernetes.io/name: surgewave
spec:
  clusterIP: None
  # The brokers reach each other by these names before they are ready: a broker is ready only
  # once it has a quorum, and it finds the quorum through this service.
  publishNotReadyAddresses: true
  selector:
    app: surgewave
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: grpc
      port: 9093
      targetPort: grpc
    - name: replication
      port: 10092
      targetPort: replication

---
# Client-facing service (LoadBalancer or ClusterIP): ready brokers only
apiVersion: v1
kind: Service
metadata:
  name: surgewave
  labels:
    app: surgewave
    app.kubernetes.io/name: surgewave
spec:
  type: ClusterIP
  selector:
    app: surgewave
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: grpc
      port: 9093
      targetPort: grpc

---
# External LoadBalancer (optional)
apiVersion: v1
kind: Service
metadata:
  name: surgewave-external
  labels:
    app: surgewave
    app.kubernetes.io/name: surgewave
spec:
  type: LoadBalancer
  selector:
    app: surgewave
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: grpc
      port: 9093
      targetPort: grpc
