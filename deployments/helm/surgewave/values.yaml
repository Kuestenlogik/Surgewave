# Surgewave Helm Chart Values

# ─── Broker ───────────────────────────────────────────────────────────────────

broker:
  # Every broker votes on metadata. A broker is ready only once it has caught up with the
  # metadata log, which takes a majority of the brokers: one of three alone is never ready.
  # The number is part of every broker's configuration (cluster nodes, quorum voters);
  # changing it restarts all brokers with a new quorum.
  replicaCount: 3
  image:
    repository: ghcr.io/kuestenlogik/surgewave-broker
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  storage:
    size: 10Gi
    storageClassName: ""
  ports:
    kafka: 9092
    grpc: 9093
    mqtt: 1883
    replication: 10092
  config:
    autoTopicCreation: true
    defaultPartitions: 3
    defaultReplicationFactor: 3
    logRetentionHours: 168
    logRetentionBytes: -1
    logSegmentBytes: 1073741824
    maxConnectionsPerIp: 100
    maxRequestSize: 104857600
    minInsyncReplicas: 2
  # Extra environment variables for broker pods
  extraEnv: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"

# ─── Control UI ───────────────────────────────────────────────────────────────

control:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kuestenlogik/surgewave-control
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  port: 5050
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  ingress:
    enabled: false
    className: ""
    hostname: surgewave.local
    annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: []
    # - secretName: surgewave-control-tls
    #   hosts:
    #     - surgewave.local

# ─── Schema Registry ─────────────────────────────────────────────────────────

schemaRegistry:
  enabled: true

# ─── Kafka Connect ────────────────────────────────────────────────────────────

# The Connect worker embedded in each broker. Leave it off with more than one broker: a broker
# that does not lead the partition of the worker's pipeline store topic does not finish
# starting and never becomes ready.
connect:
  enabled: false
  groupId: surgewave-connect
  configTopic: surgewave-connect-configs
  offsetsTopic: surgewave-connect-offsets
  statusTopic: surgewave-connect-status

# ─── Tiered Storage ──────────────────────────────────────────────────────────

tieredStorage:
  enabled: false
  provider: ""  # s3, azure, gcp
  s3:
    bucket: ""
    region: ""
    accessKey: ""
    secretKey: ""
  azure:
    connectionString: ""
    container: ""
  gcp:
    bucket: ""

# ─── Features ─────────────────────────────────────────────────────────────────

features:
  mqtt:
    enabled: false
  graphql:
    enabled: false
  dataMesh:
    enabled: false
  privacy:
    enabled: false
  multiTenancy:
    enabled: false
  cruiseControl:
    enabled: false

# ─── Security ─────────────────────────────────────────────────────────────────

security:
  tls:
    enabled: false
    certSecret: ""
  sasl:
    enabled: false
    mechanisms:
      - PLAIN
  acl:
    enabled: false
    superUsers: []
  rbac:
    create: true

# ─── Monitoring ───────────────────────────────────────────────────────────────

monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
  prometheusRules:
    enabled: false

# ─── Pod Configuration ────────────────────────────────────────────────────────

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The cluster's DNS domain. The brokers tell clients and each other their pod's name under it:
# <pod>.<release>-headless.<namespace>.svc.<clusterDomain>
clusterDomain: cluster.local

podSecurityContext:
  runAsUser: 1000
  fsGroup: 1000

securityContext: {}

nodeSelector: {}
tolerations: []

# Anti-affinity: "soft" (preferred) or "hard" (required)
antiAffinity: soft

# Health checks, all on the gRPC / REST port.
#
# /health/live answers as soon as the broker's HTTP endpoint is bound, whether or not the broker
# has a quorum. /health/ready answers 200 only once the broker has caught up with the metadata
# log, which takes a leader and therefore a majority of the brokers.
#
# The startup probe holds the other two back until the endpoint is bound, which is a few seconds
# after the process starts, whether or not another broker runs; periodSeconds * failureThreshold
# has to cover the start itself on the CPU the pod is given.
startupProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60

# Restarts a broker whose process no longer answers. Never fails for want of a quorum.
livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Takes a broker without a quorum out of the client Service; it is not restarted.
readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# ─── Pod Disruption Budget ────────────────────────────────────────────────────

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 2

# ─── Service Configuration ───────────────────────────────────────────────────

service:
  type: ClusterIP
  external:
    enabled: false
    type: LoadBalancer
    annotations: {}

# Extra volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []
