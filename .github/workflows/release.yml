name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # ================================================================
  # verify-notes: gate — no release without a curated body
  # ================================================================
  # Bowire pattern (docs/release-notes/): the GitHub release body is
  # curated prose from the repo, not installation boilerplate.
  # Source-of-truth chain:
  #   1) docs/release-notes/v<tag>.md  (preserved body)
  #   2) docs/release-notes/upcoming.md (canonical path before the tag)
  #   3) Legacy: body of a GitHub draft release for the tag
  # Failing fast here saves the entire build time and prevents the
  # "shipped with a placeholder body, edited afterwards" pattern.
  verify-notes:
    name: Verify curated release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify curated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILE_BODY=""
          for candidate in "docs/release-notes/${TAG}.md" "docs/release-notes/upcoming.md"; do
            if [[ -f "$candidate" ]]; then
              # Strip the front matter; a body only counts as "real" with
              # at least one ### section (placeholder detection —
              # the template carries only ## headings + HTML comments).
              BODY=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm<2{next} {print}' "$candidate")
              SECTION_COUNT=$(echo "$BODY" | grep -cE '^### ' || true)
              if [[ "${SECTION_COUNT:-0}" -gt 0 ]]; then
                FILE_BODY="$candidate"
                break
              fi
            fi
          done
          if [[ -n "$FILE_BODY" ]]; then
            echo "✓ Curated body for ${TAG} found: ${FILE_BODY}"
            exit 0
          fi
          # Legacy fallback: GitHub draft release body.
          BODY=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .body" 2>/dev/null | head -c 200 || true)
          if [[ -n "$BODY" ]]; then
            echo "✓ Curated body for ${TAG} found (legacy: GitHub draft release)"
            exit 0
          fi
          echo "::error::No curated release body found for ${TAG}."
          echo ""
          echo "Curate docs/release-notes/upcoming.md (at least one ### section),"
          echo "commit + push, and then push the tag again."
          echo "Convention: docs/release-notes/README.md"
          exit 1

  # ================================================================
  # build-msi: WiX MSI build (Windows-only)
  # ================================================================
  # WiX v5 is Windows-only (`warning WIX0000: WiX Toolset only supports
  # Windows`) — so the MSI build cannot run in the Linux-based release
  # job. Bowire pattern: a separate windows-latest job builds only the
  # .msi, uploads it as an artefact, and the release job downloads it
  # again before the GitHub release step.
  build-msi:
    name: Build Windows MSI
    needs: [verify-notes]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Self-contained win-x64 publishes for Broker, CLI, Control —
      # the wixproj references these directly via BrokerPublishDir / CliPublishDir
      # / ControlPublishDir.
      - name: Publish win-x64 binaries (broker / cli / control)
        shell: bash
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App  -c Release -r win-x64 --self-contained -o deployments/installer/publish/broker  -p:Version=$V
          dotnet publish src/Kuestenlogik.Surgewave.Tool     -c Release -r win-x64 --self-contained -o deployments/installer/publish/cli     -p:Version=$V
          dotnet publish src/Kuestenlogik.Surgewave.Control -c Release -r win-x64 --self-contained -o deployments/installer/publish/control -p:Version=$V
          cp deployments/installer/config/appsettings.json            deployments/installer/publish/broker/
          cp deployments/installer/config/appsettings.Production.json deployments/installer/publish/broker/

      - name: Generate icon if missing
        shell: pwsh
        run: |
          $icon = "deployments/installer/Kuestenlogik.Surgewave.Installer/surgewave.ico"
          if (-not (Test-Path $icon)) {
            pwsh -NoProfile -File deployments/installer/Kuestenlogik.Surgewave.Installer/generate-icon.ps1
          }

      # The wixproj uses the WixToolset.Sdk (PackageReference on
      # WixToolset.UI.wixext), so `dotnet build` is enough — no separate
      # `wix` tool has to be installed globally.
      #
      # PublishDirs must be absolute Windows paths (`pwd -W` in
      # Git Bash on windows-latest returns the Windows-style path).
      - name: Build MSI
        shell: bash
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet build deployments/installer/Kuestenlogik.Surgewave.Installer/Kuestenlogik.Surgewave.Installer.wixproj \
            -c Release \
            -p:Version=$V \
            -p:BrokerPublishDir="$(pwd -W)/deployments/installer/publish/broker" \
            -p:CliPublishDir="$(pwd -W)/deployments/installer/publish/cli" \
            -p:ControlPublishDir="$(pwd -W)/deployments/installer/publish/control"
          mkdir -p msi-out
          # Directory.Build.props redirects BaseOutputPath to artifacts/bin/...,
          # so the MSI does not end up under deployments/installer/.
          # We search the whole repo for *.msi (there is only the one).
          find . -name '*.msi' -not -path './msi-out/*' -exec cp {} msi-out/surgewave-$V-win-x64.msi \;
          ls -la msi-out

      - name: Upload MSI artefact
        uses: actions/upload-artifact@v7
        with:
          name: artefacts-msi
          path: msi-out/*.msi
          retention-days: 1

  # ================================================================
  # release: NuGets, containers, Linux/macOS binaries, release assembly
  # ================================================================
  release:
    runs-on: ubuntu-latest
    needs: [build-msi]

    # Job-level env so that the secret is visible in step-level `if:`
    # expressions (the `secrets` context is not directly available there).
    # Empty string when the org secret is not set, so that the `env.X != ''`
    # gates skip correctly instead of failing. Bowire pattern.
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Kuestenlogik.Surgewave.slnx

      - name: Build
        run: dotnet build Kuestenlogik.Surgewave.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      # No test run here. ci.yml triggers on `v*` tags as well, so the tagged
      # commit is already being tested by the setup that is exercised on every
      # push — two lanes plus IntegrationTests on its own runner. This workflow
      # used to run the whole solution a second time through a single `dotnet
      # test`, and that second, differently-configured run was the only place a
      # failure ever appeared: v0.5.1 died in it with an OutOfMemoryException
      # inside `dotnet test`'s own orchestrator while launching the
      # IntegrationTests module.
      #
      # The cause was never established. What was ruled out: the module's output
      # (6 KB), its memory (135 MB peak), and the hang-dump watchdog (never
      # fired). Excluding the project made the release pass, but a workaround for
      # an unexplained failure in a duplicated test run is two problems, not one.
      # Deleting the duplicate removes both, and leaves exactly one test
      # configuration in the repository.
      #
      # What is kept is the guarantee: publishing is irreversible, so refuse to
      # publish a commit whose CI run is not green.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "Waiting for the CI run on ${SHA}"
          for attempt in $(seq 1 90); do
            RUN=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "$SHA" --limit 1 --json status,conclusion,url --jq '.[0] | "\(.status) \(.conclusion // "-") \(.url)"' || true)
            STATUS=$(echo "$RUN" | cut -d' ' -f1)
            CONCLUSION=$(echo "$RUN" | cut -d' ' -f2)
            URL=$(echo "$RUN" | cut -d' ' -f3)
            # `.[0]` on an empty list yields the string "null", not an empty
            # one, so testing for emptiness alone would read "no run exists" as
            # a status and fall through to the not-completed branch forever.
            if [ -z "$STATUS" ] || [ "$STATUS" = "null" ]; then
              echo "  no CI run yet for ${SHA} (attempt ${attempt})"
            else
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI is green: $URL"
                  exit 0
                fi
                echo "::error::CI concluded '${CONCLUSION}' for ${SHA} — refusing to publish. $URL"
                exit 1
              fi
              echo "  CI ${STATUS} (attempt ${attempt}) — $URL"
            fi
            sleep 40
          done
          echo "::error::No completed CI run for ${SHA} after an hour — refusing to publish."
          exit 1

      - name: Pack NuGet
        run: dotnet pack Kuestenlogik.Surgewave.slnx -c Release --no-build -o artifacts/packages -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for GHCR
        # GHCR rejects uppercase registry segments. github.repository_owner
        # is "Kuestenlogik" (capital K) for this org, so we lower-case it
        # once and reuse the result for the Broker + Control container
        # publishes.
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Multi-arch container → GHCR (always) + Docker Hub (optional)
      # ----------------------------------------------------------
      # `ContainerRuntimeIdentifiers` turns one `dotnet publish` call
      # into several arch-specific image builds in one go and
      # publishes them as a multi-arch manifest. The pre-restore needs
      # the same RID list, otherwise the container publish fails with
      # `NETSDK1047: Assets file ... doesn't have a target for
      # 'net10.0/linux-arm64'`.
      #
      # `ContainerImageTags="$V;latest"` tags the images twice.
      # The inner quoting form is needed so that MSBuild sees the ';' as
      # part of the property value instead of an argument separator.
      #
      # ContainerRegistry takes only the host ("ghcr.io"); the org/image
      # path goes via ContainerRepository. Combining both
      # ("ghcr.io/<owner>") triggers CONTAINER2012 "could not recognise
      # registry" because the SDK takes it as a literal host.
      - name: Pre-restore Broker (multi-RID)
        run: |
          dotnet restore src/Kuestenlogik.Surgewave.Broker.App \
            "-p:RuntimeIdentifiers=\"linux-x64;linux-arm64\""

      - name: Pre-restore Control (multi-RID)
        run: |
          dotnet restore src/Kuestenlogik.Surgewave.Control \
            "-p:RuntimeIdentifiers=\"linux-x64;linux-arm64\""

      - name: Push Broker container to GHCR (multi-arch)
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App \
            -c Release \
            -t:PublishContainer \
            --no-restore \
            -p:Version=$V \
            -p:GeneratePackageOnBuild=false \
            "-p:ContainerRuntimeIdentifiers=\"linux-x64;linux-arm64\"" \
            "-p:ContainerImageTags=\"$V;latest\"" \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.ghcr.outputs.owner }}/surgewave-broker

      - name: Push Control container to GHCR (multi-arch)
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Control \
            -c Release \
            -t:PublishContainer \
            --no-restore \
            -p:Version=$V \
            -p:GeneratePackageOnBuild=false \
            "-p:ContainerRuntimeIdentifiers=\"linux-x64;linux-arm64\"" \
            "-p:ContainerImageTags=\"$V;latest\"" \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.ghcr.outputs.owner }}/surgewave-control

      # Docker Hub is gated: without DOCKERHUB_TOKEN + DOCKERHUB_USERNAME
      # the steps skip without failing; the GHCR image is the official
      # source and Docker Hub the second distribution.
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # The GHCR steps above have already built the multi-RID assets,
      # `--no-restore` reuses the cache. The only additional effort
      # is the registry push itself — the image is byte-identical to GHCR.
      # The namespace is fixed to `kuestenlogik` — the org namespace on
      # Docker Hub. DOCKERHUB_USERNAME is only the login user (can be a
      # user account with push rights on the org), not the
      # repository namespace.
      - name: Push Broker container to Docker Hub (multi-arch)
        if: ${{ env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != '' }}
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App \
            -c Release \
            -t:PublishContainer \
            --no-restore \
            -p:Version=$V \
            -p:GeneratePackageOnBuild=false \
            "-p:ContainerRuntimeIdentifiers=\"linux-x64;linux-arm64\"" \
            "-p:ContainerImageTags=\"$V;latest\"" \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=kuestenlogik/surgewave-broker

      - name: Push Control container to Docker Hub (multi-arch)
        if: ${{ env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != '' }}
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Control \
            -c Release \
            -t:PublishContainer \
            --no-restore \
            -p:Version=$V \
            -p:GeneratePackageOnBuild=false \
            "-p:ContainerRuntimeIdentifiers=\"linux-x64;linux-arm64\"" \
            "-p:ContainerImageTags=\"$V;latest\"" \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=kuestenlogik/surgewave-control

      # Self-contained Broker binaries (no .NET SDK needed on target)
      - name: Publish Broker binaries
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App -c Release -r linux-x64 --self-contained -o ./publish/surgewave-broker-linux-x64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App -c Release -r linux-arm64 --self-contained -o ./publish/surgewave-broker-linux-arm64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App -c Release -r win-x64 --self-contained -o ./publish/surgewave-broker-win-x64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App -c Release -r osx-x64 --self-contained -o ./publish/surgewave-broker-osx-x64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Broker.App -c Release -r osx-arm64 --self-contained -o ./publish/surgewave-broker-osx-arm64 -p:Version=${{ steps.version.outputs.VERSION }}

      # Self-contained Control UI binaries
      - name: Publish Control binaries
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Control -c Release -r linux-x64 --self-contained -o ./publish/surgewave-control-linux-x64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Control -c Release -r win-x64 --self-contained -o ./publish/surgewave-control-win-x64 -p:Version=${{ steps.version.outputs.VERSION }}

      # Self-contained CLI binaries. macOS variants drive the Homebrew tap;
      # linux + win cover the Chocolatey / direct-download story.
      - name: Publish CLI binaries
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Tool -c Release -r linux-x64 --self-contained -o ./publish/surgewave-cli-linux-x64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Tool -c Release -r linux-arm64 --self-contained -o ./publish/surgewave-cli-linux-arm64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Tool -c Release -r win-x64 --self-contained -o ./publish/surgewave-cli-win-x64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Tool -c Release -r osx-x64 --self-contained -o ./publish/surgewave-cli-osx-x64 -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet publish src/Kuestenlogik.Surgewave.Tool -c Release -r osx-arm64 --self-contained -o ./publish/surgewave-cli-osx-arm64 -p:Version=${{ steps.version.outputs.VERSION }}

      # The Windows MSI comes from the build-msi job (Windows runner) as an artefact.
      # WiX v5 is Windows-only, so it cannot be built inline in the Linux-based
      # release job — see above.
      - name: Download MSI artefact
        uses: actions/download-artifact@v8
        with:
          name: artefacts-msi
          path: publish/

      # Build .deb and .rpm packages
      - name: Build Linux packages
        run: |
          chmod +x deployments/installer/linux/build-packages.sh
          cd deployments/installer/linux
          bash build-packages.sh ${{ steps.version.outputs.VERSION }} amd64
          cp build/*.deb ../../../publish/ 2>/dev/null || true
          cp build/*.rpm ../../../publish/ 2>/dev/null || true

      # Create tar.gz/zip archives
      - name: Create archives
        run: |
          cd publish
          for dir in surgewave-broker-linux-* surgewave-broker-osx-* surgewave-control-linux-*; do
            [ -d "$dir" ] && tar -czvf "${dir}-${{ steps.version.outputs.VERSION }}.tar.gz" -C "$dir" .
          done
          for dir in surgewave-broker-win-* surgewave-control-win-* surgewave-cli-win-*; do
            [ -d "$dir" ] && zip -r "${dir}-${{ steps.version.outputs.VERSION }}.zip" "$dir"
          done
          # CLI tarballs cover linux + macOS — they drive the Homebrew tap.
          for dir in surgewave-cli-linux-* surgewave-cli-osx-*; do
            [ -d "$dir" ] && tar -czvf "${dir}-${{ steps.version.outputs.VERSION }}.tar.gz" -C "$dir" .
          done

      - name: Publish NuGet to GitHub Packages
        run: dotnet nuget push ./artifacts/packages/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # nuget.org: only on stable tags (no `-rc` suffix) and only when the
      # secret is configured. NUGET_API_KEY needs the 'Push new packages
      # and package versions' scope with glob `Kuestenlogik.Surgewave.*` or
      # `surgewave*` (kebab IDs for executables).
      - name: Publish NuGet to nuget.org
        if: ${{ !contains(github.ref, '-rc') && env.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push "./artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ steps.version.outputs.VERSION }}
          path: artifacts/packages/*.nupkg

      # Bowire pattern: the curated body comes from docs/release-notes/
      # (v<tag>.md → upcoming.md → legacy draft), the front matter is
      # stripped, the installation commands move into a collapsed
      # <details> block, and a seam separates the editorial part
      # from the auto-generated commit list.
      - name: Pull editorial body (file first, GitHub draft as fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="${{ steps.version.outputs.VERSION }}"
          NOTES=""
          for candidate in "docs/release-notes/${TAG}.md" "docs/release-notes/upcoming.md"; do
            if [[ -f "$candidate" ]]; then
              CANDIDATE_BODY=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm<2{next} {print}' "$candidate")
              SECTION_COUNT=$(echo "$CANDIDATE_BODY" | grep -cE '^### ' || true)
              if [[ "${SECTION_COUNT:-0}" -gt 0 ]]; then
                NOTES="$CANDIDATE_BODY"
                echo "Using editorial body from ${candidate} (${SECTION_COUNT} section(s))"
                break
              else
                echo "Skipping ${candidate} — no ### subsections detected (treated as placeholder)."
              fi
            fi
          done
          if [[ -z "$NOTES" ]]; then
            NOTES=$(gh api "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .body" 2>/dev/null || true)
            [[ -n "$NOTES" ]] && echo "Using editorial body from GitHub draft release (legacy)."
          fi
          {
            if [[ -z "$NOTES" ]]; then
              echo "## $TAG"
              echo ""
              echo "_See the auto-generated change list below._"
            else
              echo "$NOTES"
            fi
            echo ""
            echo "<details>"
            echo "<summary><b>Installation</b> — NuGet, Container, MSI, Linux, Helm</summary>"
            echo ""
            echo "**NuGet:**"
            echo '```bash'
            echo "dotnet add package Kuestenlogik.Surgewave.Client --version ${V}"
            echo '```'
            echo ""
            echo "**Container — pre-built (Docker Hub, multi-arch linux/amd64 + arm64):**"
            echo '```bash'
            echo "docker pull kuestenlogik/surgewave-broker:${V}"
            echo "docker pull kuestenlogik/surgewave-control:${V}"
            echo "# …or :latest"
            echo '```'
            echo ""
            echo "**Container — alternative registry (GHCR):**"
            echo '```bash'
            echo "docker pull ghcr.io/kuestenlogik/surgewave-broker:${V}"
            echo "docker pull ghcr.io/kuestenlogik/surgewave-control:${V}"
            echo '```'
            echo ""
            echo "**Container — build from source:**"
            echo '```bash'
            echo "dotnet publish src/Kuestenlogik.Surgewave.Broker.App -c Release /t:PublishContainer"
            echo "dotnet publish src/Kuestenlogik.Surgewave.Control -c Release /t:PublishContainer"
            echo '```'
            echo ""
            echo "**Windows MSI (silent install):**"
            echo '```powershell'
            echo "msiexec /i surgewave-${V}-win-x64.msi /qn"
            echo '```'
            echo ""
            echo "**Linux:**"
            echo '```bash'
            echo "sudo bash install.sh"
            echo '```'
            echo ""
            echo "**Helm:**"
            echo '```bash'
            echo "helm install surgewave deploy/helm/surgewave/ --set broker.image.tag=${V}"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "_The full commit list, contributors, and compare-URL diff are auto-generated below._"
            echo ""
          } > release-body.md
          echo "----- release-body.md -----"
          cat release-body.md
          echo "----- end -----"

      # Release title theme from the milestone this release delivers.
      # Milestones are work sections `M<n> — <theme>` (docs/contributing/
      # project-board.md, "Milestones and releases"); the version number is
      # assigned at the cut, so the tag message names the sections and
      # scripts/resolve-milestone.mjs reads them (fallback: a title starting with
      # v<base>, then the frontmost finished section). Never an error: without
      # a match the title stays bare, and the log says so.
      - name: Resolve release title from milestone
        id: title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          node scripts/resolve-milestone.mjs "$TAG" > resolved.json || echo '{"theme":"","numbers":""}' > resolved.json
          THEME=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('resolved.json','utf8')).theme || '')" || true)
          NUMBERS=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('resolved.json','utf8')).numbers || '')" || true)
          echo "milestones=${NUMBERS}" >> "$GITHUB_OUTPUT"
          if [[ -n "$THEME" ]]; then
            echo "title=${TAG} — ${THEME}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No theme found on milestone matching v${BASE} or v${MAJ_MIN} — release title will be bare ${TAG}."
            echo "title=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.title.outputs.title }}
          body_path: release-body.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: |
            artifacts/packages/*.nupkg
            publish/*.tar.gz
            publish/*.zip
            publish/*.msi
            publish/*.deb
            publish/*.rpm
