name: Code Coverage

on:
  # The two path lists are duplicated on purpose: the Actions workflow parser
  # does not support YAML anchors/aliases, so a &anchor / *alias pair here would
  # be rejected. Keep them in sync by hand.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '**/*.csproj'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'Kuestenlogik.Surgewave.slnx'
      - 'codecoverage.runsettings'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '**/*.csproj'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'Kuestenlogik.Surgewave.slnx'
      - 'codecoverage.runsettings'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

# Safe to filter by path here: main carries no branch protection, so this is not
# a required status check. On a protected branch a paths filter would leave the
# check pending — not skipped — and block the merge.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # IntegrationTests is excluded from coverage: it brings up real
      # multi-broker topology, and under instrumentation it is both the slowest
      # assembly by far and the most timing-sensitive.
      #
      # Excluded by exact project path via a generated solution, NOT by test
      # name. The previous `--filter "FullyQualifiedName!~IntegrationTests"`
      # matched on the fully-qualified name, so it also silently excluded
      # Cli.IntegrationTests, RaftIntegrationTests and
      # AmqpQueueViewIntegrationTests — three assemblies that were missing from
      # the reported figure without anyone asking for that.
      #
      # Expect the reported coverage to MOVE when this lands: those three are
      # measured again for the first time. The direction should be upward (more
      # tests, same production code), but treat the first post-merge number as
      # the new baseline rather than comparing it to older runs.
      - name: Compute coverage solution
        run: |
          set -euo pipefail
          EXCLUDE="tests/Kuestenlogik.Surgewave.IntegrationTests/Kuestenlogik.Surgewave.IntegrationTests.csproj"

          grep -oE 'Path="[^"]*Tests\.csproj"' Kuestenlogik.Surgewave.slnx \
            | sed -E 's/^Path="//; s/"$//' | sort -u > coverage-all.txt

          if ! grep -qxF "$EXCLUDE" coverage-all.txt; then
            echo "::error::$EXCLUDE is not in the solution — renamed or moved?"
            echo "::error::Fix the path here, otherwise IntegrationTests silently runs under coverage again."
            exit 1
          fi
          grep -vxF "$EXCLUDE" coverage-all.txt > coverage-projects.txt

          { echo '<Solution>'
            while read -r p; do printf '  <Project Path="%s" />\n' "$p"; done < coverage-projects.txt
            echo '</Solution>'
          } > coverage.slnx

          echo "assemblies under coverage: $(wc -l < coverage-projects.txt) of $(wc -l < coverage-all.txt)"
          echo "excluded: $EXCLUDE"

      - name: Run tests with coverage
        # Test-Assemblies SERIELL, konsistent mit ci.yml/release.yml.
        # Coverage kommt aus Microsoft.Testing.Extensions.CodeCoverage. Coverlet
        # scheidet aus: der Collector war VSTest-only, und coverlet.msbuild
        # laeuft im MTP-Modus ebenfalls nicht, weil dotnet test /p:-Argumente
        # an die Test-App reicht statt an MSBuild - der Lauf erzeugt dann still
        # gar keinen Report.
        #
        # Die Engine wechselt damit, die Zahlen sind also nicht 1:1 mit den frueher
        # von Coverlet gemessenen vergleichbar. Erste Messung 2026-08-22:
        # 42 % Line / 37.8 % Branch gegen 37.7 % / 34.9 % vorher, der Floor unten
        # behaelt damit reichlich Luft und bleibt wie er ist.
        #
        # Kein fixes --coverage-output: jedes Testprojekt schriebe sonst in
        # dieselbe Datei. Die Extension vergibt pro Projekt einen <guid>-Namen,
        # ReportGenerator sammelt sie per Glob ein.
        #
        # Bei 0%-Assemblies: --diagnostic anhaengen und das Log im
        # results-directory pruefen - Instrumentierungsfehler landen nicht auf
        # der Konsole.
        run: |
          dotnet test --solution coverage.slnx -c Release --no-build \
            --max-parallel-test-modules 1 \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-settings codecoverage.runsettings \
            --results-directory artifacts/coverage/raw \
            --verbosity minimal

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'artifacts/coverage/raw/**/*.cobertura.xml'
          targetdir: 'artifacts/coverage/report'
          reporttypes: 'Html;Badges;TextSummary;MarkdownSummaryGithub'
          assemblyfilters: '+Kuestenlogik.Surgewave.*;-*.Tests;-*.Benchmarks'
          classfilters: '-*.Program;-*.Startup'

      - name: Print coverage summary
        if: always()
        run: |
          if [ -f "artifacts/coverage/report/Summary.txt" ]; then
            echo "## Coverage Summary"
            cat artifacts/coverage/report/Summary.txt
          fi

      # Enforce a coverage floor on the whole solution. The Plugins subsystem
      # sits much higher (Plugins-Base ~50 %, Packaging ~89 %, Repository
      # ~78 %), but the broker / streams / clustering / connect codebases
      # pull the cross-solution numbers down to roughly 30 % line / 30 %
      # branch. The thresholds below are set just under that floor so a
      # regression of more than a few points fails CI; raising them is a
      # follow-on coverage-push project.
      - name: Enforce coverage thresholds
        if: always()
        run: |
          set -euo pipefail
          SUMMARY=artifacts/coverage/report/Summary.txt
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::Coverage summary not found at $SUMMARY — did ReportGenerator run?"
            exit 1
          fi
          LINE=$(grep -E '^\s*Line coverage:' "$SUMMARY" | head -1 | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          BRANCH=$(grep -E '^\s*Branch coverage:' "$SUMMARY" | head -1 | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$LINE" ] || [ -z "$BRANCH" ]; then
            echo "::error::Could not parse Line/Branch percentages from $SUMMARY"
            cat "$SUMMARY"
            exit 1
          fi
          MIN_LINE=30
          MIN_BRANCH=28
          echo "Line coverage:   ${LINE}% (min ${MIN_LINE}%)"
          echo "Branch coverage: ${BRANCH}% (min ${MIN_BRANCH}%)"
          # awk for float comparison — bash's [[ ]] can't compare decimals.
          BAD=0
          if awk "BEGIN { exit !($LINE < $MIN_LINE) }"; then
            echo "::error::Line coverage ${LINE}% is below the ${MIN_LINE}% threshold."
            BAD=1
          fi
          if awk "BEGIN { exit !($BRANCH < $MIN_BRANCH) }"; then
            echo "::error::Branch coverage ${BRANCH}% is below the ${MIN_BRANCH}% threshold."
            BAD=1
          fi
          if [ "$BAD" -eq 1 ]; then exit 1; fi
          echo "OK — both thresholds met."

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/report/
          retention-days: 30

      - name: Upload coverage badges
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: coverage-badges
          path: |
            artifacts/coverage/report/badge_combined.svg
            artifacts/coverage/report/badge_linecoverage.svg
            artifacts/coverage/report/badge_branchcoverage.svg
            artifacts/coverage/report/badge_methodcoverage.svg
          retention-days: 90

      - name: Add coverage to PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: artifacts/coverage/report/SummaryGithub.md
