name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs. Pushes to main must never be cancelled — the job
  # publishes NuGet packages at the end, and a half-finished publish is worse
  # than a redundant run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # Degree of parallelism for the parallel test lane. Set to 1 to make that
  # lane strictly sequential again — that restores today's behaviour without
  # reverting anything else. 3 rather than 4: the runner has 4 vCPU and each
  # testhost additionally parallelises test collections internally, so one core
  # is left for the agent and log streaming.
  PARALLEL_LANE_DOP: 3

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(git rev-parse --short HEAD)
            # Prefix the sha with 'g' (git-describe convention). An all-numeric short sha with a
            # leading zero (e.g. 0558208) is an INVALID SemVer 2.0 pre-release identifier, which makes
            # `dotnet pack` fail with "PackageVersion string ... is invalid"; the letter forces an
            # alphanumeric identifier, where leading zeros are allowed.
            echo "VERSION=0.1.0-ci.${COMMIT_COUNT}.g${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Restore
        run: dotnet restore Kuestenlogik.Surgewave.slnx --configfile nuget.config

      - name: Build
        run: dotnet build Kuestenlogik.Surgewave.slnx -c Release --no-restore -p:Version=$VERSION -p:SourceRevisionId=$(git rev-parse HEAD)

      # Test assemblies are split into two lanes. The allowlist below is the
      # ONLY hardcoded list; the serial lane is computed as "everything else",
      # so a newly added test project lands in the serial lane automatically
      # and can never silently end up in no lane at all.
      #
      # Deleting one line from PARALLEL_PROJECTS moves that assembly back to
      # the serial lane — per-assembly rollback, one line.
      - name: Compute test lanes
        run: |
          set -euo pipefail

          # Each of these was audited for: no host/broker startup, no port
          # binding, no subprocess, no fixed shared path, no process-wide state
          # mutation, and — the subtle one — no assertion on elapsed wall clock.
          # An assembly that merely runs fast is NOT sufficient: anything with a
          # timing upper bound flakes under a co-runner and belongs in serial.
          PARALLEL_PROJECTS="
            tests/Kuestenlogik.Surgewave.Analyzers.Tests/Kuestenlogik.Surgewave.Analyzers.Tests.csproj
            tests/Kuestenlogik.Surgewave.Api.GraphQL.Tests/Kuestenlogik.Surgewave.Api.GraphQL.Tests.csproj
            tests/Kuestenlogik.Surgewave.Api.Grpc.Tests/Kuestenlogik.Surgewave.Api.Grpc.Tests.csproj
            tests/Kuestenlogik.Surgewave.Benchmarks.Comparison.Tests/Kuestenlogik.Surgewave.Benchmarks.Comparison.Tests.csproj
            tests/Kuestenlogik.Surgewave.Build.Tests/Kuestenlogik.Surgewave.Build.Tests.csproj
            tests/Kuestenlogik.Surgewave.Cdc.Tests/Kuestenlogik.Surgewave.Cdc.Tests.csproj
            tests/Kuestenlogik.Surgewave.Compatibility.Confluent.Kafka.Tests/Kuestenlogik.Surgewave.Compatibility.Confluent.Kafka.Tests.csproj
            tests/Kuestenlogik.Surgewave.Control.Tests/Kuestenlogik.Surgewave.Control.Tests.csproj
            tests/Kuestenlogik.Surgewave.Edge.Tests/Kuestenlogik.Surgewave.Edge.Tests.csproj
            tests/Kuestenlogik.Surgewave.Gateway.Tests/Kuestenlogik.Surgewave.Gateway.Tests.csproj
            tests/Kuestenlogik.Surgewave.Linq.Tests/Kuestenlogik.Surgewave.Linq.Tests.csproj
            tests/Kuestenlogik.Surgewave.Marketplace.Tests/Kuestenlogik.Surgewave.Marketplace.Tests.csproj
            tests/Kuestenlogik.Surgewave.Plugins.Marketplace.Tests/Kuestenlogik.Surgewave.Plugins.Marketplace.Tests.csproj
            tests/Kuestenlogik.Surgewave.Plugins.Tests/Kuestenlogik.Surgewave.Plugins.Tests.csproj
            tests/Kuestenlogik.Surgewave.Protocol.Amqp.Tests/Kuestenlogik.Surgewave.Protocol.Amqp.Tests.csproj
            tests/Kuestenlogik.Surgewave.Protocol.Kafka.Tests/Kuestenlogik.Surgewave.Protocol.Kafka.Tests.csproj
            tests/Kuestenlogik.Surgewave.Protocol.Native.Tests/Kuestenlogik.Surgewave.Protocol.Native.Tests.csproj
            tests/Kuestenlogik.Surgewave.Protocol.WebSocket.Tests/Kuestenlogik.Surgewave.Protocol.WebSocket.Tests.csproj
            tests/Kuestenlogik.Surgewave.Runtime.Tests/Kuestenlogik.Surgewave.Runtime.Tests.csproj
            tests/Kuestenlogik.Surgewave.Schema.Registry.Tests/Kuestenlogik.Surgewave.Schema.Registry.Tests.csproj
            tests/Kuestenlogik.Surgewave.SourceGenerators.Tests/Kuestenlogik.Surgewave.SourceGenerators.Tests.csproj
            tests/Kuestenlogik.Surgewave.Storage.Tiering.Tests/Kuestenlogik.Surgewave.Storage.Tiering.Tests.csproj
            tests/Kuestenlogik.Surgewave.Streams.Linq.Tests/Kuestenlogik.Surgewave.Streams.Linq.Tests.csproj
            tests/Kuestenlogik.Surgewave.Tests/Kuestenlogik.Surgewave.Tests.csproj
            tests/Kuestenlogik.Surgewave.Tool.Tests/Kuestenlogik.Surgewave.Tool.Tests.csproj
            tests/Kuestenlogik.Surgewave.Wasm.Tests/Kuestenlogik.Surgewave.Wasm.Tests.csproj
          "

          # '*Tests.csproj' matches exactly the test projects; the shared
          # helper libraries end in 'Testing.csproj' and are not caught.
          grep -oE 'Path="[^"]*Tests\.csproj"' Kuestenlogik.Surgewave.slnx \
            | sed -E 's/^Path="//; s/"$//' | sort -u > lane-all.txt
          printf '%s\n' $PARALLEL_PROJECTS | sed '/^$/d' | sort -u > lane-parallel.txt

          # A typo in the allowlist would otherwise point at nothing and the
          # assembly would quietly run in neither lane. Fail loudly instead.
          MISSING=$(comm -23 lane-parallel.txt lane-all.txt || true)
          if [ -n "$MISSING" ]; then
            echo "::error::Parallel lane references projects that are not in the solution:"
            echo "$MISSING"
            exit 1
          fi

          comm -13 lane-parallel.txt lane-all.txt > lane-serial-all.txt

          # IntegrationTests runs in the integration-tests job on its own runner.
          # Measured at ~10 min it is more than half the serial lane, and a
          # separate VM takes it off this job's critical path entirely.
          #
          # Matched as a full line against the exact project path, NOT by name:
          # a substring or FullyQualifiedName filter would also swallow
          # Cli.IntegrationTests, RaftIntegrationTests and
          # AmqpQueueViewIntegrationTests, which is the mistake coverage.yml
          # makes today.
          INTEGRATION_PROJECT="tests/Kuestenlogik.Surgewave.IntegrationTests/Kuestenlogik.Surgewave.IntegrationTests.csproj"
          if ! grep -qxF "$INTEGRATION_PROJECT" lane-serial-all.txt; then
            echo "::error::Expected $INTEGRATION_PROJECT in the serial lane but it is not there."
            echo "::error::Most likely it was renamed or moved. Update the path here AND in the integration-tests job — otherwise it silently runs twice, or not at all."
            exit 1
          fi
          grep -vxF "$INTEGRATION_PROJECT" lane-serial-all.txt > lane-serial.txt
          echo "moved to its own job: $INTEGRATION_PROJECT"

          gen_slnx() {
            { echo '<Solution>'
              while read -r p; do printf '  <Project Path="%s" />\n' "$p"; done < "$2"
              echo '</Solution>'
            } > "$1"
          }
          gen_slnx lane-parallel.slnx lane-parallel.txt
          gen_slnx lane-serial.slnx   lane-serial.txt

          echo "parallel lane: $(wc -l < lane-parallel.txt) assemblies"
          echo "serial lane:   $(wc -l < lane-serial.txt) assemblies"
          echo "total:         $(wc -l < lane-all.txt) assemblies"
          echo "--- serial lane ---"; cat lane-serial.txt

      # Parallel lane runs first: it finishes in ~2 min, so a trivial breakage
      # is reported early instead of after the full serial run.
      #
      # hangdump: shorter window and a mini dump on purpose. The slowest assembly
      # in this lane measures 34 s, so 300 s of silence would be pathological —
      # and three concurrent FULL memory dumps would saturate the runner's disk
      # and starve the remaining test hosts, which is self-reinforcing.
      - name: Test (parallel lane)
        run: |
          dotnet test --solution lane-parallel.slnx -c Release --no-build -v minimal \
            --max-parallel-test-modules ${PARALLEL_LANE_DOP} \
            --hangdump --hangdump-timeout 120s --hangdump-type Mini

      # Serial lane: behaviour identical to before, one module at a time.
      # This lane holds everything that starts in-process brokers on random
      # ports, binds real loopback sockets, spawns subprocesses, or asserts on
      # elapsed time. It must NEVER run concurrently with the lane above on the
      # same VM — hence two sequential steps, not two background processes.
      - name: Test (serial lane)
        run: |
          dotnet test --solution lane-serial.slnx -c Release --no-build -v normal \
            --max-parallel-test-modules 1 \
            --hangdump --hangdump-timeout 300s --hangdump-type Full

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps-${{ github.run_id }}
          path: |
            **/TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack
        run: dotnet pack Kuestenlogik.Surgewave.slnx -c Release --no-build -o artifacts/packages -p:Version=$VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg

      # Push to GitHub Packages on every push (pre-release on main, stable on tags)
      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://nuget.pkg.github.com/Kuestenlogik/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

  # IntegrationTests on its own runner. Deliberately NOT `needs: build`: it
  # builds for itself and starts at t=0, so it runs alongside the build job
  # instead of queueing behind it.
  #
  # Sharing the build output instead was measured and rejected: a single test
  # output directory is ~350 MB (of which ~275 MB is runtimes/ — the native
  # RocksDB/SQLite/Wasmtime binaries copied into every test project), so the
  # upload/download would cost more minutes than the split saves, and the
  # consumer could only start after the producer finished building anyway.
  # Building the closure of one test project here is ~2:30 against ~10 min of
  # test time. The cost is runner minutes, which are free on a public repo.
  #
  # Its own VM also means no port or CPU interference with the two lanes — the
  # whole reason those assemblies are serial in the first place.
  integration-tests:
    name: Integration tests (own runner)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Only this project's dependency closure — not CLI, Control, Marketplace
      # or the samples, which the solution-wide build in the other job covers.
      # Restore and build are separate steps mirroring the build job, because
      # --configfile is a restore option and dotnet build does not take it.
      - name: Restore
        run: dotnet restore tests/Kuestenlogik.Surgewave.IntegrationTests/Kuestenlogik.Surgewave.IntegrationTests.csproj --configfile nuget.config

      - name: Build
        run: dotnet build tests/Kuestenlogik.Surgewave.IntegrationTests/Kuestenlogik.Surgewave.IntegrationTests.csproj -c Release --no-restore

      # One module at a time and the 300 s/full hangdump settings are unchanged
      # from the serial lane: this assembly brings up real multi-broker topology
      # on random ports, and a full memory dump is the diagnostic that matters
      # when it hangs.
      #
      # No -v normal, and the live progress renderer off. This module runs 10+
      # minutes and logs several brokers to the console, and the dotnet test
      # orchestrator dies on it with an OutOfMemoryException - first "Array
      # dimensions exceeded supported range", then "Insufficient memory" -
      # after every one of the 155 tests has passed. The module itself is fine:
      # the identical command completes locally, and no hang dump is ever
      # written, so neither the tests nor the HangDump extension are involved.
      # What is left is the orchestrator accumulating the module's output, so
      # both the verbosity and the renderer that retains it are turned off.
      - name: Test
        run: |
          dotnet test --project tests/Kuestenlogik.Surgewave.IntegrationTests/Kuestenlogik.Surgewave.IntegrationTests.csproj \
            -c Release --no-build --max-parallel-test-modules 1 \
            --no-progress --no-ansi \
            --hangdump --hangdump-timeout 300s --hangdump-type Full

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps-integration-${{ github.run_id }}
          path: |
            **/TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7
