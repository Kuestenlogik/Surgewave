# Draft the editorial release-notes body for the next release and open a PR.
#
# Bowire concept (docs/release-notes/): the curated prose of the NEXT
# version lives in docs/release-notes/upcoming.md (front matter: title +
# version). release.yml gates on this file (at least one ### section) and
# uses it as the GitHub release body; RELEASE_NOTES.md is only a
# generated mirror now (scripts/ci/generate-release-notes.mjs).
#
# This workflow pre-fills ~80 % of upcoming.md: theme from the milestone
# title, highlights from the closed milestone issues (bucketed by
# area/kind), maintenance from the commit log since the last tag. The
# bullets are DELIBERATELY not ### sections — that way the release gate
# enforces the curation (rewrite bullets into ### prose) before a tag
# can ship. Review the PR, polish, merge, then tag.
#
# Protection: an upcoming.md that already carries curated ### sections
# is NOT overwritten — the workflow then aborts with a hint.
#
# Trigger: workflow_dispatch with a version like `0.5.0` (with or without v).

name: Draft release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to draft notes for (e.g. 0.5.0). With or without leading v.'
        required: true
      milestone:
        description: 'Milestone the release ships (e.g. M1). Empty = the frontmost complete section.'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: draft-release-notes-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SURGEWAVE_DISPATCH_TOKEN }}
          fetch-depth: 0

      - name: Guard — refuse to overwrite curated content
        run: |
          set -euo pipefail
          if [ -f docs/release-notes/upcoming.md ]; then
            BODY=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm<2{next} {print}' docs/release-notes/upcoming.md)
            SECTION_COUNT=$(echo "$BODY" | grep -cE '^### ' || true)
            if [ "${SECTION_COUNT:-0}" -gt 0 ]; then
              echo "::error::docs/release-notes/upcoming.md already carries ${SECTION_COUNT} curated ### section(s) — this workflow does not overwrite curation. Edit it by hand."
              exit 1
            fi
          fi

      # Milestones are ordered work sections `M<n> — <theme>`; the version is
      # chosen at the cut. Before the tag exists, the milestone to draft for is
      # the one named here (`milestone` input, e.g. M1) or, unnamed, the
      # frontmost complete section — scripts/resolve-milestone.mjs applies the
      # same rules the release pipeline uses on the tag.
      - name: Resolve milestone + theme
        id: ms
        env:
          GH_TOKEN: ${{ secrets.SURGEWAVE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          VERSION="${RAW#v}"
          NAMED="${{ github.event.inputs.milestone }}"
          if [ -n "$NAMED" ]; then
            MS_TITLE=$(gh api "repos/${{ github.repository }}/milestones?state=all&per_page=100" --jq ".[] | select(.title | startswith(\"$NAMED \") or . == \"$NAMED\") | .title" | head -n 1 || true)
            THEME=$(echo "$MS_TITLE" | sed -E 's/^M[0-9]+[[:space:]]*[—-][[:space:]]*//')
          else
            node scripts/resolve-milestone.mjs "v$VERSION" > resolved.json || echo '{"milestone":"","theme":""}' > resolved.json
            MS_TITLE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('resolved.json','utf8')).milestone || '')")
            THEME=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('resolved.json','utf8')).theme || '')")
          fi
          if [ -z "$MS_TITLE" ]; then
            echo "::warning::No milestone resolved for v${VERSION} — drafting without a theme + issue list."
          fi

          {
            echo "version=$VERSION"
            echo "milestone=$MS_TITLE"
            echo "theme=$THEME"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$VERSION milestone='$MS_TITLE' theme='$THEME'"

      - name: Generate upcoming.md draft
        env:
          GH_TOKEN: ${{ secrets.SURGEWAVE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.ms.outputs.version }}
          MS_TITLE: ${{ steps.ms.outputs.milestone }}
          THEME: ${{ steps.ms.outputs.theme }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-version:refname --list 'v*' | head -n 1)
          if [ -z "$PREV_TAG" ]; then PREV_TAG=$(git rev-list --max-parents=0 HEAD); fi
          echo "Previous tag: $PREV_TAG"

          # ---- Highlights: the shared release tool (docs/contributing/project-board.md) ----
          # Closed tickets of the delivered section in this repo AND in every sibling
          # that mirrors it on the board — grouped by repository, type (Feature / Bug / Task)
          # and area; the same list the cut delivers.
          HIGHLIGHTS=""
          if [ -n "$MS_TITLE" ]; then
            HIGHLIGHTS=$(node scripts/release.mjs notes "v$VERSION" "$MS_TITLE" --highlights 2>/dev/null || true)
          fi

          # ---- Maintenance from the commit log ----
          MAINT=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges \
            | grep -E "^(fix|refactor|perf|test|ci|build|chore|docs)(\(.+\))?:" \
            | grep -vE "^chore\(roadmap\):|^chore: bump floor" \
            | head -n 30 \
            | sed 's/^/- /' \
            || true)

          # ---- Write upcoming.md ----
          mkdir -p docs/release-notes
          {
            echo "---"
            if [ -n "$THEME" ]; then
              echo "title: ${THEME}"
            else
              echo "title: <fill in before the tag — matches the milestone theme>"
            fi
            echo "version: ${VERSION}"
            echo "---"
            echo ""
            echo "<One-sentence frame for what ${VERSION} is about — replace before tagging.>"
            echo ""
            echo "## Highlights"
            echo ""
            echo "<!-- Curation required: rewrite the bullets below into ### sections with"
            echo "     2-4 sentences of prose — the release gate requires"
            echo "     at least one ### section. Pattern: ### <headline> (#issue) -->"
            echo ""
            if [ -n "$HIGHLIGHTS" ]; then
              echo "$HIGHLIGHTS"
            else
              echo "_No closed issues in the milestone yet._"
              echo ""
            fi
            if [ -n "$MAINT" ]; then
              echo "## Fixes"
              echo ""
              echo "<!-- From the commit log; group + trim to what is worth mentioning. -->"
              echo ""
              echo "$MAINT"
              echo ""
            fi
            echo "## Breaking changes"
            echo ""
            echo "<!-- Only when real — with the migration path. -->"
            echo ""
            echo "## Acknowledgements"
            echo ""
            echo "<!-- Optional. -->"
          } > docs/release-notes/upcoming.md
          echo "----- drafted upcoming.md -----"
          cat docs/release-notes/upcoming.md
          echo "----- end -----"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.SURGEWAVE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.ms.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="chore/release-notes-v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Reuse the branch on a rerun instead of creating orphan branches.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git checkout main -- docs/release-notes/upcoming.md 2>/dev/null || true
          else
            git checkout -b "$BRANCH"
          fi

          if git ls-files --error-unmatch docs/release-notes/upcoming.md > /dev/null 2>&1 && git diff --quiet docs/release-notes/upcoming.md; then
            echo "::notice::upcoming.md unchanged — draft for v${VERSION} likely already committed."
            exit 0
          fi
          git add docs/release-notes/upcoming.md
          git commit -m "chore: draft release notes for v${VERSION}"
          git push -u origin "$BRANCH" --force-with-lease

          if ! gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            # Body via heredoc → file → --body-file (inline Markdown in
            # --body "..." breaks YAML's literal-block-scalar parsing).
            cat > .pr-body.md <<PRBODY
            Auto-drafted \`docs/release-notes/upcoming.md\` for v${VERSION} via the \`Draft release notes\` workflow.

            **Before merging:**
            1. Rewrite the Highlights bullets into \`###\` sections with 2-4 sentences of prose each — the release gate requires at least one \`###\` section, so an un-curated draft cannot ship.
            2. Trim the Fixes bullets to the notable ones (roadmap-sync + floor-bump noise is already filtered).
            3. Check the front-matter \`title:\` against the milestone theme — the release title resolves from the milestone at tag time.

            After merge, push the \`v${VERSION}\` tag — \`release.yml\` uses this file as the GitHub Release body (with the Installation block collapsed below it and the auto-generated commit list after the seam).
            PRBODY
            sed -i 's/^            //' .pr-body.md
            gh pr create \
              --title "chore: draft release notes for v${VERSION}" \
              --body-file .pr-body.md \
              --label 'roadmap' \
              --base main \
              --head "$BRANCH"
            rm -f .pr-body.md
          else
            echo "PR already open for $BRANCH — pushed update, no new PR."
          fi
